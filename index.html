<title>Quaderno Pedalate</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app a schede, cruscotto "da manubrio": numeri condensati grandi, etichette piccole, grafici a tutta larghezza */
:root{
  /* Tema scuro in stile Strava: nero, grigi caldi, arancione */
  --bg:#121212; --surface:#1e1e1e; --surface2:#2a2a2a; --line:#333333; --fg:#ffffff; --muted:#a8a8a8;
  --accent:#fc5200; --accent-soft:#3a1c0c; --on-accent:#ffffff;
  --elev:#9a9a9a; --hr:#ff4d4d; --pw:#b592ff; --spd:#3db8ff; --cad:#43d18a;
  --good:#43d18a; --warn:#ffa23a; --bad:#ff4d4d; --info:#3db8ff;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:26px;height:26px;color:var(--accent)}
.me{color:var(--fg);text-decoration:none;min-width:0}.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;object-fit:cover;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:17px;border:2px solid var(--accent)}
.avatar.big{width:110px;height:110px;font-size:42px;border-width:3px}
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
.c-muted{color:var(--muted)}
table.splits th,table.splits td{text-align:right}table.splits td.best{color:var(--accent);font-weight:700}
.friend{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:8px;padding:8px 10px}
ol.rank .grow{display:grid;grid-template-columns:34px 34px 1fr auto;gap:10px;align-items:center;background:var(--surface2);border-radius:8px;padding:8px 10px;border:1px solid transparent}ol.rank .grow.me-row{border-color:var(--accent)}ol.rank .grow .who{min-width:0;display:flex;flex-direction:column}ol.rank .grow .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}ol.rank .grow .who small{color:var(--muted);font-size:12px}
.tablewrap{overflow-x:auto;max-width:100%}table.gt{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}table.gt th,table.gt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}table.gt tbody th{text-align:left;color:var(--muted);font-weight:500}table.gt thead th{vertical-align:bottom}table.gt thead th span{display:block;font-size:12px;margin-top:3px}table.gt thead th .avatar{display:inline-flex}table.gt td small{display:block;font-size:11px;color:var(--muted)}table.gt td.best{color:var(--accent);font-weight:700}
details.gride{background:var(--surface2);border-radius:8px;padding:8px 10px}details.gride summary{cursor:pointer}details.gride[open]{display:flex;flex-direction:column;gap:8px}
.goals{display:flex;flex-direction:column;gap:14px}.goal .bar{position:relative;display:block;height:10px;border-radius:5px;background:var(--surface2);margin:6px 0 4px;overflow:visible}.goal .bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}.goal .bar em{position:absolute;top:-3px;width:2px;height:16px;background:var(--fg);opacity:.6}.goal small{font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600}.cal-d{min-height:52px;border-radius:6px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;font-size:13px;color:var(--muted);border:1px solid transparent;font-weight:400}.cal-d.has{color:var(--fg);cursor:pointer;background:var(--accent-soft)}.cal-d.today{border-color:var(--accent)}.cal-d i{display:flex;gap:2px;margin-top:2px}.cal-d small{font-size:10px;color:var(--muted)}
.cal-d b,.cal-key b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}.cal-d b.spin,.cal-key b.spin{background:var(--info)}.cal-key b{margin-left:6px}

.kinds{flex-wrap:nowrap;overflow-x:auto;max-width:100%}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gallery .ph{padding:0;border:none;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--surface2)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:calc(100% - 70px);object-fit:contain;border-radius:6px}
.lb-bar{display:flex;gap:10px;align-items:center;color:#fff;flex-wrap:wrap;justify-content:center}
.lb-bar button{background:#2a2a2a;color:#fff;border-color:#444;min-width:44px}
.cam{color:var(--accent)}

.act .medals svg,.medals svg{width:18px;height:18px}
.medals{display:inline-flex;align-items:center;gap:1px;margin-right:6px;vertical-align:-4px}.medals b{font-size:12px;color:var(--muted);margin-left:2px}
.podium-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.podium-sum>div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface2);border-radius:8px;padding:10px 4px}.podium-sum .num{font-size:28px}.podium-sum small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.chipbtn{white-space:nowrap;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
ol.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}ol.rank button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface2);border:1px solid transparent;font-weight:400;padding:8px 10px}ol.rank button:hover{border-color:var(--accent)}ol.rank .pos{display:flex;justify-content:center;font-family:var(--f-display);font-size:20px;color:var(--muted)}ol.rank .who{min-width:0;display:flex;flex-direction:column}ol.rank .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}ol.rank .who small{color:var(--muted);font-size:12px}ol.rank .val{font-family:var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.cups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}.cup{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:10px;border-radius:8px;background:var(--surface2);opacity:.6}.cup.on{opacity:1}.cup b{display:block}.cup small{display:block;color:var(--muted);font-size:12px}.cup a{color:var(--accent);cursor:pointer;text-decoration:none}.cup .bar{display:block;height:5px;border-radius:3px;background:var(--line);margin:5px 0 2px;overflow:hidden}.cup .bar i{display:block;height:100%;background:var(--accent)}
.achv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}.achv>div{display:flex;gap:10px;align-items:center}.achv b{display:block}.achv small{color:var(--muted);font-size:13px}
@media (max-width:560px){.podium-sum .num{font-size:22px}}

#install{padding:6px 12px}
button[disabled]{opacity:.55;cursor:default}
.codebox{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all;background:var(--surface2);padding:8px 10px;border-radius:6px;user-select:all}
section.view{display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:34px}
h2{font-size:22px;letter-spacing:.01em}
h3{font-size:17px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}
.num{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px 18px}
.stat .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .val{font-family:var(--f-display);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .val small{font-size:15px;font-weight:500;color:var(--muted);margin-left:2px}
.stat .delta{font-size:12px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.banner p{flex:1 1 260px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button:hover{filter:brightness(1.06)}
.chart{position:relative;height:220px;width:100%}
.chart.tall{height:280px}.chart.short{height:130px}
.form-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fc{border-radius:8px;background:var(--surface2);padding:10px 12px}
.fc .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fc .val{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}.c-info{color:var(--info)}
.advice{display:flex;flex-direction:column;gap:10px}
.adv{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:stretch}
.adv .dot{border-radius:3px;background:currentColor}
.adv b{display:block;font-weight:600}
.adv p{color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.act{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left;width:100%;font-weight:400}
.act:hover{border-color:var(--accent)}
.act svg{width:70px;height:56px}
.act .t{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .m{font-size:13px;color:var(--muted)}
.act .k{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.act .k span small{font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.tag.ex{color:var(--accent);border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=search],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.lmap{position:relative}.map-hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:500;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:5px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
.map-done{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:600;background:var(--accent);color:#fff;border:none;min-height:40px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lmap.free{outline:2px solid var(--accent)}
.lmap{width:100%;height:380px;max-width:100%;border-radius:8px;background:var(--surface2);z-index:0}
@media (max-width:560px){.lmap{height:320px}}
.leaflet-control-layers,.leaflet-bar a{color:#1b1f1d}
.map{width:100%;aspect-ratio:3/2;max-width:100%;background:var(--surface2);border-radius:8px;display:block}
.zones{display:flex;flex-direction:column;gap:6px}
.zone{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.zone .b{height:14px;border-radius:3px;background:var(--surface2);overflow:hidden}
.zone .b i{display:block;height:100%}
.zone .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.rec .l{color:var(--muted);font-size:14px}
.rec .v{font-family:var(--f-display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.rec a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted);cursor:pointer}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.log{font-size:13px;color:var(--muted);max-height:180px;overflow:auto;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.back{background:none;border:none;color:var(--muted);padding:0;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
code{font-size:13px;background:var(--surface2);padding:1px 5px;border-radius:4px}
@media (max-width:560px){nav.tabs{width:100%;justify-content:flex-start}nav.tabs a{padding:6px 9px;font-size:14px}.wide{display:none}h1{font-size:28px}.form-cards .fc .val{font-size:26px}.zone{grid-template-columns:92px 1fr 84px}.stat .val{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#fly{position:fixed;inset:0;z-index:2000;background:#000;color:#fff}
#fly-map{position:absolute;inset:0}
.fly-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 24px;background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none}
.fly-top>*{pointer-events:auto}.fly-top b{display:block;font-size:16px}.fly-top small{color:#ddd}
.fly-top button{background:rgba(0,0,0,.5);color:#fff;border-color:rgba(255,255,255,.3);min-width:44px;min-height:44px}

.fly-hud small{display:block;font-size:11px;color:#ccc}.fly-hud b{font-size:18px;font-variant-numeric:tabular-nums}.fly-hud i{font-style:normal;font-size:12px;color:#ccc;margin-left:3px}
.fly-msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);padding:10px 16px;border-radius:10px;text-align:center;max-width:86vw}

#fly-play{min-width:56px;font-size:18px}
.fly-dot{z-index:2;width:18px;height:18px;border-radius:50%;background:#fc5200;border:3px solid #fff;box-shadow:0 0 0 4px rgba(252,82,0,.35),0 2px 6px rgba(0,0,0,.5)}
.fly-open{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px}

#fly .maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom) + 140px)}
.fly-btns .seg button{padding:8px 9px}.fly-btns{flex-wrap:nowrap}
.fly-out a{text-decoration:none}
.fly-top,.fly-bar,.fly-msg{z-index:3}
.plan{display:grid;gap:10px}.pw{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.pw .day{font-family:var(--f-display);font-weight:700;text-transform:uppercase;color:var(--accent);font-size:14px}.pw p{margin:4px 0 0}.pw .zt{color:var(--hr);font-weight:600}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
'use strict';
/* ====================== costanti ====================== */
const SEMI = 180 / 2147483648, FIT_EPOCH = 631065600;
const WINDOWS = [5,15,30,60,120,300,600,1200,1800,3600,5400,7200];
const HRZ = [0.60,0.70,0.80,0.90];
const HRZ_N = ['Z1 Recupero','Z2 Fondo','Z3 Medio','Z4 Soglia','Z5 Massimale'];
const PZ = [0.55,0.75,0.90,1.05,1.20,1.50];
const PZ_N = ['Z1 Recupero','Z2 Resistenza','Z3 Tempo','Z4 Soglia','Z5 VO2max','Z6 Anaerobica','Z7 Sprint'];
const SPORT_L = {ride:'Ciclismo', run:'Corsa', walk:'Camminata', other:'Altro'};
const SUB_L = {mtb:'MTB', gravel:'Gravel', virtual:'Virtuale', road:'Strada', indoor:'Indoor'};
const DAY = 86400000;
const state = { kind:(['all','bike','spin'].includes(store('qp-kind'))? store('qp-kind') : 'all'), medals:{}, rkCat:'dist', rkPeriod:'sempre', log:[], acts:[], examples:false, view:'riepilogo', sel:null, charts:{}, fitness:[], range:90, filter:'ride', q:'' };

/* ====================== utilità ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (x, d=0) => x==null || !isFinite(x) ? '–' : x.toLocaleString('it-IT',{minimumFractionDigits:d, maximumFractionDigits:d});
const fmtDur = s => { if(s==null||!isFinite(s)) return '–'; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const fmtHM = s => { s=Math.round(s/60); return `${Math.floor(s/60)}h ${String(s%60).padStart(2,'0')}m`; };
const fmtDate = ms => new Date(ms).toLocaleDateString('it-IT',{weekday:'short', day:'numeric', month:'short', year:'numeric'});
const fmtDay = ms => new Date(ms).toLocaleDateString('it-IT',{day:'numeric', month:'short'});
const fmtTime = ms => new Date(ms).toLocaleTimeString('it-IT',{hour:'2-digit', minute:'2-digit'});
const durLabel = w => w<60? w+'s' : w<3600? (w/60)+'′' : (w/3600)+'h';
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dayStart = ms => { const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); };
const dayKey = ms => { const d=new Date(ms); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const weekStart = ms => { const d=new Date(dayStart(ms)); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.getTime(); };
function hav(a,b,c,d){ const R=6371008.8, r=Math.PI/180; const x=Math.sin((c-a)*r/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(x))); }
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

/* ====================== archivio locale (IndexedDB) ====================== */
const DB = {
  db:null,
  async open(){ try{ this.db = await new Promise((res,rej)=>{ const r=indexedDB.open('quaderno-pedalate',2); r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('acts')) d.createObjectStore('acts',{keyPath:'id'}); if(!d.objectStoreNames.contains('media')) d.createObjectStore('media',{keyPath:'id'}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }catch(e){ this.db=null; } },
  req(mode, fn, st='acts'){ return new Promise(res=>{ if(!this.db) return res(null); try{ const r=fn(this.db.transaction(st,mode).objectStore(st)); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }catch(e){ res(null); } }); },
  mPut(m){ return this.req('readwrite', s=>s.put(m), 'media'); },
  mGet(id){ return this.req('readonly', s=>s.get(id), 'media'); },
  mDel(id){ return this.req('readwrite', s=>s.delete(id), 'media'); },
  mClear(){ return this.req('readwrite', s=>s.clear(), 'media'); },
  all(){ return this.req('readonly', s=>s.getAll()).then(r=>r||[]); },
  put(a){ return this.req('readwrite', s=>s.put(a)); },
  del(id){ return this.req('readwrite', s=>s.delete(id)); },
  clear(){ return this.req('readwrite', s=>s.clear()); }
};

/* ====================== profilo atleta ====================== */
const profile = Object.assign({first:'', last:'', photo:null, weight:75, age:45, sex:'m', hrMax:null, ftp:null}, store('qp-profile')||{});
const SPIN_RE=/spin|cyclette|rulli|indoor|trainer|zwift|virtual/i;
function kindOf(a){
  if(a.sport==='ride'){ const summaryOnly=a.stravaId && !(a.prof&&a.prof.d&&a.prof.d.length>1);
    if(a.sub==='indoor'||a.sub==='virtual'||a.indoor||a.trainer||SPIN_RE.test(a.name||'')||(!summaryOnly && !(a.track&&a.track.length>1))) return 'spin'; return 'bike'; }
  if(a.sport==='other' && SPIN_RE.test(a.name||'')) return 'spin';
  return 'other';
}
const KINDS=[['all','Tutte'],['bike','Bici'],['spin','Spinning']];
const allRides = () => state.acts.filter(a=>kindOf(a)!=='other');
const cycling = () => allRides().filter(a=>state.kind==='all' || kindOf(a)===state.kind);
function kindBar(){ return `<div class="seg kinds" role="group" aria-label="Tipo di uscita">${KINDS.map(([k,l])=>`<button data-kind="${k}" aria-pressed="${state.kind===k}">${l}</button>`).join('')}</div>`; }
function hrMaxEff(){ if(profile.hrMax) return profile.hrMax; if(state.examples) return hrMaxEx; const yr=Date.now()-365*DAY; const m=Math.max(0,...state.acts.filter(a=>a.start>yr && a.maxHr).map(a=>a.maxHr)); return m>=140 && m<=215 ? m : Math.round(208-0.7*profile.age); }
function bestPowerSince(w, since, all){ let b=null, id=null; for(const a of (all? allRides() : cycling())){ if(a.start<since || !a.best) continue; const i=WINDOWS.indexOf(w); const v=a.best[i]; if(v && (!b||v>b)){ b=v; id=a.id; } } return {w:b, id}; }
function ftpEst(){ const b=bestPowerSince(1200, Date.now()-120*DAY, true).w; return b? Math.round(b*0.95) : null; }
function ftpEff(){ return profile.ftp || ftpEst(); }
const lthr = () => hrMaxEff()*0.89;
function tss(a){
  const ftp=ftpEff();
  if(a.np && ftp && a.pwSec) return a.pwSec * a.np*a.np / (ftp*ftp*3600) * 100;
  if(a.hrSec && a.sumHr2) return a.sumHr2 / (lthr()**2) / 3600 * 100;
  return a.moving/3600*45;
}
function kcal(a){
  if(a.avgPw && a.pwSec) return a.avgPw*a.pwSec/1000/(4.184*0.24);
  if(a.avgHr){ const w=profile.weight, g=profile.age; const perMin = profile.sex==='f' ? (-20.4022+0.4472*a.avgHr-0.1263*w+0.074*g)/4.184 : (-55.0969+0.6309*a.avgHr+0.1988*w+0.2017*g)/4.184; return Math.max(0, perMin*a.moving/60); }
  return null;
}
function hrZoneSecs(hist){ const hm=hrMaxEff(); const lim=HRZ.map(f=>f*hm); const z=[0,0,0,0,0]; if(!hist) return z; hist.forEach((s,b)=>{ if(!s||b<40) return; let i=0; while(i<4 && b>=lim[i]) i++; z[i]+=s; }); return z; }
function pwZoneSecs(hist){ const ftp=ftpEff(); const z=[0,0,0,0,0,0,0]; if(!hist||!ftp) return z; hist.forEach((s,b)=>{ if(!s) return; const w=b*10+5; let i=0; while(i<6 && w>=PZ[i]*ftp) i++; z[i]+=s; }); return z; }

/* ====================== lettura file: FIT ====================== */
function readField(dv,p,f,le){
  const bt=f.bt&0x1f; let v;
  switch(bt){
    case 0: case 2: case 10: case 13: if(f.size!==1) return null; v=dv.getUint8(p); return (bt===10? v===0 : v===0xff)? null : v;
    case 1: if(f.size!==1) return null; v=dv.getInt8(p); return v===0x7f? null : v;
    case 3: if(f.size!==2) return null; v=dv.getInt16(p,le); return v===0x7fff? null : v;
    case 4: case 11: if(f.size!==2) return null; v=dv.getUint16(p,le); return (bt===11? v===0 : v===0xffff)? null : v;
    case 5: if(f.size!==4) return null; v=dv.getInt32(p,le); return v===0x7fffffff? null : v;
    case 6: case 12: if(f.size!==4) return null; v=dv.getUint32(p,le); return (bt===12? v===0 : v===0xffffffff)? null : v;
    case 8: if(f.size!==4) return null; v=dv.getFloat32(p,le); return isFinite(v)? v : null;
    case 9: if(f.size!==8) return null; v=dv.getFloat64(p,le); return isFinite(v)? v : null;
    default: return null;
  }
}
function parseFIT(ab){
  const dv=new DataView(ab);
  if(dv.byteLength<14) throw new Error('file FIT troppo corto');
  const hs=dv.getUint8(0);
  const sig=String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11));
  if(sig!=='.FIT') throw new Error('non è un file FIT valido');
  const end=Math.min(hs+dv.getUint32(4,true), dv.byteLength);
  let p=hs, lastTs=null, sport=null, sub=null; const defs={}, recs=[];
  while(p<end){
    const h=dv.getUint8(p++); let local, tsOff=null;
    if(h&0x80){ local=(h>>5)&3; tsOff=h&0x1f; }
    else{
      local=h&0x0f;
      if(h&0x40){
        const le=dv.getUint8(p+1)===0, gm=dv.getUint16(p+2,le), nfld=dv.getUint8(p+4); p+=5;
        const fields=[]; let size=0;
        for(let i=0;i<nfld;i++){ const f={num:dv.getUint8(p), size:dv.getUint8(p+1), bt:dv.getUint8(p+2)}; fields.push(f); size+=f.size; p+=3; }
        let dev=0; if(h&0x20){ const nd=dv.getUint8(p++); for(let i=0;i<nd;i++){ dev+=dv.getUint8(p+1); p+=3; } }
        defs[local]={le, gm, fields, size, dev}; continue;
      }
    }
    const d=defs[local]; if(!d) throw new Error('file FIT danneggiato');
    if(p+d.size+d.dev>dv.byteLength) break;
    const v={}; let q=p;
    for(const f of d.fields){ v[f.num]=readField(dv,q,f,d.le); q+=f.size; }
    p+=d.size+d.dev;
    if(v[253]!=null) lastTs=v[253];
    else if(tsOff!=null && lastTs!=null){ let ts=(lastTs - (lastTs & 0x1f)) + tsOff; if(tsOff < (lastTs & 0x1f)) ts+=0x20; lastTs=ts; v[253]=ts; }
    if(d.gm===20){
      const r={t: v[253]!=null ? v[253]+FIT_EPOCH : null};
      if(v[0]!=null && v[1]!=null){ r.lat=v[0]*SEMI; r.lon=v[1]*SEMI; }
      const alt = v[78]!=null ? v[78]/5-500 : v[2]!=null ? v[2]/5-500 : null; if(alt!=null) r.alt=alt;
      if(v[3]!=null) r.hr=v[3]; if(v[4]!=null) r.cad=v[4]; if(v[5]!=null) r.dist=v[5]/100;
      const sp = v[73]!=null ? v[73]/1000 : v[6]!=null ? v[6]/1000 : null; if(sp!=null) r.spd=sp;
      if(v[7]!=null) r.pw=v[7];
      recs.push(r);
    } else if(d.gm===18){ if(v[5]!=null) sport=v[5]; if(v[6]!=null) sub=v[6]; }
    else if(d.gm===12 && sport==null && v[0]!=null){ sport=v[0]; if(v[1]!=null) sub=v[1]; }
  }
  const sp = sport===2 ? 'ride' : sport===1 ? 'run' : (sport===11||sport===17) ? 'walk' : sport==null ? 'ride' : 'other';
  const sb = {6:'indoor',7:'road',8:'mtb',9:'mtb',46:'gravel',58:'virtual'}[sub] || null;
  return {recs, sport:sp, sub:sb};
}

/* ====================== lettura file: GPX / TCX ====================== */
function parseXML(text){ const doc=new DOMParser().parseFromString(text.replace(/^﻿/,'').trim(),'application/xml'); if(doc.getElementsByTagName('parsererror').length) throw new Error('XML non leggibile'); return doc; }
const kid=(el,n)=>{ const l=el.getElementsByTagNameNS('*',n); return l.length? l[0] : null; };
const numOf=(el,n)=>{ const k=kid(el,n); if(!k) return null; const v=parseFloat(k.textContent); return isFinite(v)? v : null; };
function sportFromText(s){ s=String(s||'').toLowerCase(); if(/run|corsa/.test(s)) return {sport:'run'}; if(/walk|hik|cammin|escurs/.test(s)) return {sport:'walk'}; const sub = /mountain|mtb/.test(s)?'mtb' : /gravel/.test(s)?'gravel' : /virtual/.test(s)?'virtual' : null; if(!s || /bik|cycl|ride|cicl|bici|^\d+$/.test(s) || sub) return {sport:'ride', sub}; return {sport:'other'}; }
function parseGPX(text){
  const doc=parseXML(text), recs=[];
  for(const p of doc.getElementsByTagNameNS('*','trkpt')){
    const te=kid(p,'time'); if(!te) continue; const t=Date.parse(te.textContent.trim())/1000; if(!isFinite(t)) continue;
    const r={t, lat:parseFloat(p.getAttribute('lat')), lon:parseFloat(p.getAttribute('lon'))};
    const e=numOf(p,'ele'); if(e!=null) r.alt=e;
    const hr=numOf(p,'hr'); if(hr!=null) r.hr=hr;
    const cad=numOf(p,'cad'); if(cad!=null) r.cad=cad;
    const pw=numOf(p,'power') ?? numOf(p,'PowerInWatts'); if(pw!=null) r.pw=pw;
    recs.push(r);
  }
  const trk=doc.getElementsByTagNameNS('*','trk')[0];
  let name=null, type=null;
  if(trk) for(const c of trk.children){ if(c.localName==='name') name=c.textContent.trim(); if(c.localName==='type') type=c.textContent.trim(); }
  return Object.assign({recs, name}, sportFromText(type));
}
function parseTCX(text){
  const doc=parseXML(text), recs=[];
  const act=doc.getElementsByTagNameNS('*','Activity')[0];
  for(const tp of doc.getElementsByTagNameNS('*','Trackpoint')){
    const te=kid(tp,'Time'); if(!te) continue; const t=Date.parse(te.textContent.trim())/1000; if(!isFinite(t)) continue;
    const r={t}; const la=numOf(tp,'LatitudeDegrees'), lo=numOf(tp,'LongitudeDegrees'); if(la!=null&&lo!=null){ r.lat=la; r.lon=lo; }
    const a=numOf(tp,'AltitudeMeters'); if(a!=null) r.alt=a;
    const d=numOf(tp,'DistanceMeters'); if(d!=null) r.dist=d;
    const hb=kid(tp,'HeartRateBpm'); if(hb){ const v=numOf(hb,'Value'); if(v!=null) r.hr=v; }
    const c=numOf(tp,'Cadence'); if(c!=null) r.cad=c;
    const w=numOf(tp,'Watts'); if(w!=null) r.pw=w;
    const s=numOf(tp,'Speed'); if(s!=null) r.spd=s;
    recs.push(r);
  }
  return Object.assign({recs, name:null}, sportFromText(act? act.getAttribute('Sport') : ''));
}

/* ====================== calcolo statistiche di un'attività ====================== */
function rollingMax(arr, w){ if(arr.length<w) return null; let s=0; for(let i=0;i<w;i++) s+=arr[i]; let m=s; for(let i=w;i<arr.length;i++){ s+=arr[i]-arr[i-w]; if(s>m) m=s; } return m/w; }
function processRecords(raw, meta){
  const sorted=raw.filter(r=>r.t!=null && isFinite(r.t)).sort((a,b)=>a.t-b.t);
  const R=[];
  for(const r of sorted){ const l=R[R.length-1]; if(l && l.t===r.t){ for(const k in r) if(r[k]!=null && !Number.isNaN(r[k])) l[k]=r[k]; } else R.push(Object.assign({},r)); }
  if(R.length<10) throw new Error('troppi pochi punti registrati');
  const n=R.length;
  for(const r of R){ if(r.lat!=null && (!isFinite(r.lat)||!isFinite(r.lon)||(r.lat===0&&r.lon===0)||Math.abs(r.lat)>90)){ delete r.lat; delete r.lon; } }
  const hasDist = R.filter(r=>r.dist!=null).length > n*0.5;
  const hasGps = R.filter(r=>r.lat!=null).length > n*0.3;
  let cum=0, lp=null;
  for(let i=0;i<n;i++){
    const r=R[i];
    if(hasDist){ const prev=i? R[i-1].dist : 0; if(r.dist==null || r.dist<prev) r.dist=prev; }
    else if(hasGps){ if(r.lat!=null){ if(lp) cum+=hav(lp.lat,lp.lon,r.lat,r.lon); lp=r; } r.dist=cum; }
    else { if(i && R[i-1].spd!=null) cum+=R[i-1].spd*Math.min(5, r.t-R[i-1].t); r.dist=cum; }
  }
  const d0=R[0].dist; for(const r of R) r.dist-=d0;
  const distance=R[n-1].dist;
  // velocità levigata su ~5 s
  const vs=new Float64Array(n); let k=0;
  for(let i=1;i<n;i++){ while(k<i-1 && R[i].t-R[k+1].t>=5) k++; const dt=R[i].t-R[k].t; vs[i]= dt>0 ? (R[i].dist-R[k].dist)/dt : 0; }
  vs[0]=vs[1]||0;
  let moving=0, maxSpd=0;
  for(let i=1;i<n;i++){
    const dt=R[i].t-R[i-1].t; if(dt<=0) continue;
    if(distance>200){ const v=(R[i].dist-R[i-1].dist)/dt; if(dt<=60 && vs[i]>=0.7 && v>=0.3) moving+=dt; }
    else if(dt<=10) moving+=dt;
    if(vs[i]<33 && vs[i]>maxSpd) maxSpd=vs[i];
  }
  const elapsed=R[n-1].t-R[0].t;
  // altitudine e dislivello
  let gain=0, maxAlt=null, minAlt=null; const sm=new Array(n).fill(null);
  if(R.filter(r=>r.alt!=null).length>n*0.3){
    let last=R.find(r=>r.alt!=null).alt; const a=R.map(r=>{ if(r.alt!=null) last=r.alt; return last; });
    const ps=[0]; for(const x of a) ps.push(ps[ps.length-1]+x);
    const w=3; for(let i=0;i<n;i++){ const lo=Math.max(0,i-w), hi=Math.min(n-1,i+w); sm[i]=(ps[hi+1]-ps[lo])/(hi-lo+1); }
    let ref=sm[0]; for(let i=1;i<n;i++){ const x=sm[i]; if(x-ref>=2){ gain+=x-ref; ref=x; } else if(ref-x>=2) ref=x; }
    maxAlt=Math.max(...a); minAlt=Math.min(...a);
  }
  // serie al secondo (pause lunghe compresse in 1 s)
  const P=[], H=[], C=[];
  for(let i=1;i<n;i++){ const dt=Math.round(R[i].t-R[i-1].t); if(dt<=0) continue; const reps=dt<=5? dt : 1; const r=R[i]; for(let j=0;j<reps;j++){ P.push(r.pw||0); H.push(r.hr||0); C.push(r.cad||0); } }
  const hasPw=R.filter(r=>r.pw>0).length>n*0.2, hasHr=R.filter(r=>r.hr>0).length>n*0.2, hasCad=R.filter(r=>r.cad>0).length>n*0.1;
  const A={};
  if(hasPw){
    const N=P.length; let s=0, mx=0; for(const x of P){ s+=x; if(x>mx) mx=x; }
    A.avgPw=s/N; A.maxPw=mx; A.pwSec=N;
    if(N>=30){ let rs=0, s4=0, c=0; for(let i=0;i<N;i++){ rs+=P[i]; if(i>=30) rs-=P[i-30]; if(i>=29){ s4+=(rs/30)**4; c++; } } A.np=(s4/c)**0.25; }
    A.best=WINDOWS.map(w=>{ const v=rollingMax(P,w); return v==null? null : Math.round(v); });
    const hist=new Array(200).fill(0); for(const x of P) hist[Math.min(199,Math.floor(x/10))]++; A.pwHist=hist;
  }
  if(hasHr){
    const hist=new Array(241).fill(0); let s=0, s2=0, c=0;
    for(const x of H){ if(x>0){ s+=x; s2+=x*x; c++; hist[Math.min(240,Math.round(x))]++; } }
    A.avgHr=s/c; A.hrSec=c; A.sumHr2=s2; A.hrHist=hist; A.maxHr=Math.max(...R.map(r=>r.hr||0));
  }
  if(hasCad){ let s=0,c=0; for(const x of C) if(x>0){ s+=x; c++; } A.avgCad=c? s/c : null; }
  if(hasPw && hasHr && P.length>=2400 && A.np && A.np/A.avgPw<=1.12){
    const half=Math.floor(P.length/2); const ef=(a,b)=>{ let p=0,h=0; for(let i=a;i<b;i++) if(H[i]>0){ p+=P[i]; h+=H[i]; } return h? p/h : null; };
    const e1=ef(0,half), e2=ef(half,P.length); if(e1&&e2) A.decoupling=(e1-e2)/e1*100;
  }
  // profilo ridotto per i grafici
  const B=Math.min(500,n), prof={d:[],t:[],alt:[],spd:[],hr:[],pw:[],cad:[]}, T0=R[0].t;
  for(let b=0;b<B;b++){
    const i0=Math.floor(b*n/B), i1=Math.max(i0+1,Math.floor((b+1)*n/B));
    let sd=0, st=0, sa=0, ca=0, ss=0, sh=0, ch=0, sp=0, cp=0, sc=0, cc=0;
    for(let i=i0;i<i1;i++){ const r=R[i]; sd+=r.dist; st+=r.t-T0; ss+=vs[i]; if(sm[i]!=null){ sa+=sm[i]; ca++; } if(r.hr>0){ sh+=r.hr; ch++; } if(r.pw!=null){ sp+=r.pw; cp++; } if(r.cad>0){ sc+=r.cad; cc++; } }
    const m=i1-i0;
    prof.d.push(+(sd/m/1000).toFixed(3)); prof.t.push(Math.round(st/m)); prof.spd.push(+(ss/m*3.6).toFixed(1));
    prof.alt.push(ca? +(sa/ca).toFixed(1) : null); prof.hr.push(ch? Math.round(sh/ch) : null);
    prof.pw.push(hasPw && cp? Math.round(sp/cp) : null); prof.cad.push(cc? Math.round(sc/cc) : null);
  }
  const g=R.filter(r=>r.lat!=null), step=Math.max(1,Math.ceil(g.length/700));
  const track=[]; for(let i=0;i<g.length;i+=step) track.push([+g[i].lat.toFixed(5), +g[i].lon.toFixed(5)]);
  if(g.length) track.push([+g[g.length-1].lat.toFixed(5), +g[g.length-1].lon.toFixed(5)]);
  const start=Math.round(R[0].t*1000);
  const sport=meta.sport||'ride';
  const label = sport==='ride' ? (meta.sub==='mtb'? 'Giro in MTB' : meta.sub==='gravel'? 'Giro gravel' : 'Giro in bici') : SPORT_L[sport];
  return Object.assign({
    id:'a'+Math.round(R[0].t), name: meta.name || `${label} del ${new Date(start).toLocaleDateString('it-IT',{day:'numeric',month:'long'})}`,
    sport, sub:meta.sub||null, source:meta.source||'', start, distance, moving: moving||elapsed, elapsed, gain, maxAlt, minAlt,
    avgSpd: moving? distance/moving*3.6 : 0, maxSpd: maxSpd*3.6, prof, track, isExample:!!meta.isExample
  }, A);
}

/* ====================== import ====================== */
async function gunzip(buf){
  if(typeof DecompressionStream==='undefined') throw new Error('il browser non sa decomprimere .gz: estrai il file prima');
  const ds=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).arrayBuffer();
}
async function parseAny(name, buf, meta={}){
  let n=name.toLowerCase();
  if(n.endsWith('.gz')){ buf=await gunzip(buf); n=n.slice(0,-3); }
  let res;
  if(n.endsWith('.fit')) res=parseFIT(buf);
  else { const text=new TextDecoder().decode(buf); if(n.endsWith('.gpx')) res=parseGPX(text); else if(n.endsWith('.tcx')) res=parseTCX(text); else throw new Error('formato non supportato'); }
  const m=Object.assign({source:n.split('.').pop().toUpperCase()}, res, meta);
  if(meta.sport) { m.sport=meta.sport; if(meta.sub) m.sub=meta.sub; }
  return processRecords(res.recs, m);
}
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=''; } else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else if(c!=='\r') f+=c; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function importFiles(files){
  const bar=$('#imp-bar i');
  const say=(t,cls='')=>{ state.log.unshift({t,cls}); const l=$('#imp-log'); if(l){ const d=document.createElement('div'); d.className=cls; d.textContent=t; l.prepend(d); } };
  const jobs=[];
  for(const f of files){
    const n=f.name.toLowerCase();
    if(/\.(json|txt)(\.gz)?$/.test(n)){ try{ const k=await restoreBackup(f); say(typeof k==='string'? k+'.' : `Backup ripristinato: ${k} attività aggiunte.`,'c-good'); }catch(e){ say(`${f.name}: ${e.message}`,'c-bad'); } continue; }
    if(n.endsWith('.zip')){
      if(typeof JSZip==='undefined'){ say(`${f.name}: impossibile aprire lo ZIP (libreria non caricata). Estrai il file e carica la cartella "activities".`,'c-bad'); continue; }
      say(`Apro l'archivio ${f.name}…`);
      let zip; try{ zip=await JSZip.loadAsync(f); }catch(e){ say(`${f.name}: archivio non leggibile`,'c-bad'); continue; }
      const meta={};
      const csvE=Object.values(zip.files).find(e=>/(^|\/)activities\.csv$/i.test(e.name));
      if(csvE){
        const rows=parseCSV(await csvE.async('string')); const hd=rows[0]||[];
        const fi=hd.findIndex(h=>/file/i.test(h)); const ni=hd.findIndex((h,i)=>i!==fi && /(activity name|nome attivit|^name$|^nome$)/i.test(h.trim())); const ti=hd.findIndex(h=>/(activity type|tipo attivit|^type$|^tipo$)/i.test(h.trim())); const mi=hd.findIndex(h=>/^(media|contenuti multimediali|multimedia)$/i.test(h.trim()));
        if(fi>=0) for(const r of rows.slice(1)){ const fn=(r[fi]||'').trim(); if(!fn) continue; const st=sportFromText(ti>=0? r[ti] : ''); meta[fn.toLowerCase()]={name: ni>=0? (r[ni]||'').trim()||null : null, sport:st.sport, sub:st.sub, media: mi>=0? (r[mi]||'').split('|').map(x=>x.trim()).filter(Boolean) : []}; }
      }
      for(const e of Object.values(zip.files)){
        if(e.dir || !/\.(fit|gpx|tcx)(\.gz)?$/i.test(e.name)) continue;
        const m=meta[e.name.toLowerCase()] || meta[e.name.toLowerCase().replace(/^.*?(activities\/)/,'$1')] || {};
        const media=(m.media||[]).map(pth=>zip.file(pth)||zip.file(pth.replace(/^\/+/,''))).filter(Boolean); const mm=Object.assign({source:'Strava'}, m); delete mm.media;
        jobs.push({name:e.name, get:()=>e.async('arraybuffer'), meta:mm, media});
      }
    } else if(/\.(fit|gpx|tcx)(\.gz)?$/i.test(n)) jobs.push({name:f.name, get:()=>f.arrayBuffer(), meta:{}});
    else say(`${f.name}: formato non riconosciuto (servono .fit, .gpx, .tcx o lo ZIP di Strava)`,'c-warn');
  }
  if(!jobs.length){ renderAll(); return; }
  if(state.examples){ state.acts=[]; state.examples=false; }
  const have=new Set(state.acts.map(a=>Math.round(a.start/60000)));
  let ok=0, dup=0, bad=0, photos=0;
  for(let i=0;i<jobs.length;i++){
    const j=jobs[i];
    try{
      const a=await parseAny(j.name, await j.get(), j.meta);
      const key=Math.round(a.start/60000);
      if(have.has(key)||have.has(key-1)||have.has(key+1)){ dup++; }
      else { have.add(key); if(j.media && j.media.length){ for(const zf of j.media){ try{ const id=await savePhoto(a, await zf.async('blob')); if(id) photos++; }catch(e){} } } state.acts.push(a); await DB.put(a); ok++; if(jobs.length<30) say(`✓ ${a.name} · ${nf(a.distance/1000,1)} km`,'c-good'); }
    }catch(e){ bad++; say(`✗ ${j.name}: ${e.message}`,'c-bad'); }
    if(bar) bar.style.width=((i+1)/jobs.length*100)+'%';
    if(i%10===9) await new Promise(r=>setTimeout(r,0));
  }
  say(`Fatto: ${ok} attività importate${photos? ` con ${photos} foto` : ''}${dup? `, ${dup} già presenti` : ''}${bad? `, ${bad} non lette` : ''}.`, ok? 'c-good' : 'c-warn');
  state.acts.sort((a,b)=>b.start-a.start);
  recompute(); renderAll();
}

function rng(seed){ return ()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }; }
function genRide(rand, startMs, o){
  const c={lat:38.148, lon:15.214}, M=1200, phi=rand()*6.28, pts=[];
  const R0=o.km/(2*Math.PI)/111*0.72;
  for(let j=0;j<=M;j++){ const s=j/M, an=2*Math.PI*s; const rr=R0*(1+0.22*Math.sin(3*an+phi)+0.06*Math.sin(13*an+phi*2));
    pts.push([c.lat - rr*(1-Math.cos(an)), c.lon + rr*Math.sin(an)/Math.cos(c.lat*Math.PI/180)*0.8]); }
  const cumd=[0]; for(let j=1;j<=M;j++) cumd.push(cumd[j-1]+hav(pts[j-1][0],pts[j-1][1],pts[j][0],pts[j][1]));
  const L=cumd[M];
  const alt=s=>45 + o.climb*0.62*Math.pow(Math.sin(Math.PI*s),1.3) + o.climb*0.06*Math.sin(7*Math.PI*s+phi)**2;
  const m=86, crr=o.mtb?0.014:0.005, cda=o.mtb?0.45:0.32;
  const recs=[]; let d=0, t=startMs/1000, hr=92, j=0;
  while(d<L){
    const s=d/L, gr=clamp((alt(Math.min(1,s+40/L))-alt(s))/40,-0.15,0.18);
    let P = o.ftp*(gr>0.03? 0.88 : gr>0.005? 0.7 : gr<-0.02? 0.12 : 0.6)*(0.88+0.24*rand()) * o.fit;
    let lo=0.5, hi=o.mtb?13:17; for(let it=0;it<28;it++){ const v=(lo+hi)/2; const need=(v*m*9.81*(gr+crr)+0.5*1.2*cda*v*v*v)/0.97; if(need>P) hi=v; else lo=v; }
    const v=lo; if(gr<-0.02 && P<o.ftp*0.2) P=rand()<0.5?0:P;
    const dt=2; d+=v*dt; t+=dt;
    const tgt=58+(hrMaxEx-58)*clamp(0.32+0.42*P/o.ftp,0,1)+ (t-startMs/1000)/3600*2; hr+=(tgt-hr)*dt/25;
    while(j<M-1 && cumd[j+1]<d) j++;
    const f=clamp((d-cumd[j])/Math.max(1,cumd[j+1]-cumd[j]),0,1);
    recs.push({t, lat:pts[j][0]+(pts[j+1][0]-pts[j][0])*f, lon:pts[j][1]+(pts[j+1][1]-pts[j][1])*f, alt:alt(Math.min(1,d/L))+rand()*0.6, hr:Math.round(hr+rand()*2), pw:Math.round(P), cad:P>15? Math.round(clamp(84-gr*180+rand()*8,55,100)) : 0, dist:Math.min(d,L)});
    if(rand()<0.0006){ t+=90+rand()*200; hr=Math.max(95,hr-25); }
  }
  return recs;
}
const hrMaxEx=182;
function makeExamples(){
  const rand=rng(7), out=[], today=dayStart(Date.now());
  for(let k=84;k>=0;k--){
    const day=today-k*DAY, wd=(new Date(day).getDay()+6)%7, wk=Math.floor((84-k)/7), recovery=wk%4===3;
    let o=null;
    if(wd===1) o={km:28+rand()*6, climb:380, name:'Uscita veloce del martedì'};
    else if(wd===2 && wk%2===0) o={km:24+rand()*4, climb:150, name:'Spinning del mercoledì', indoor:true};
    else if(wd===3 && !recovery) o={km:36+rand()*6, climb:620, name:'Salite del giovedì'};
    else if(wd===5) o={km:recovery? 30 : 42+rand()*14, climb:recovery? 600 : 1050+rand()*350, mtb:true, name:'MTB nei Peloritani'};
    else if(wd===6 && !recovery && rand()<0.7) o={km:30+rand()*10, climb:520, name:'Giro della domenica'};
    if(!o) continue;
    o.ftp=205; o.fit=0.9+wk*0.012;
    const startMs=day+(7+rand()*2)*3600000;
    try{ let recs=genRide(rand,startMs,o); if(o.indoor) recs=recs.map(r=>({t:r.t, hr:r.hr, pw:r.pw, cad:r.cad, dist:r.dist})); out.push(processRecords(recs, {name:'Esempio · '+o.name, sport:'ride', sub:o.indoor?'indoor':o.mtb?'mtb':'road', source:'Esempio', isExample:true})); }catch(e){}
  }
  return out.sort((a,b)=>b.start-a.start);
}

/* ====================== forma fisica (CTL / ATL / TSB) ====================== */
function recompute(){
  const acts=state.acts; state.fitness=[];
  computeMedals();
  if(!acts.length) return;
  const byDay=new Map(); for(const a of acts){ const k=dayKey(a.start); byDay.set(k,(byDay.get(k)||0)+tss(a)); }
  const first=new Date(dayStart(Math.min(...acts.map(a=>a.start)))); const end=dayStart(Date.now());
  let ctl=0, atl=0;
  for(const d=first; d.getTime()<=end; d.setDate(d.getDate()+1)){
    const t=byDay.get(dayKey(d.getTime()))||0; const tsb=ctl-atl;
    ctl+=(t-ctl)/42; atl+=(t-atl)/7;
    state.fitness.push({d:d.getTime(), tss:t, ctl, atl, tsb});
  }
}
function formState(tsb){
  if(tsb< -30) return {l:'Affaticato', c:'c-bad'};
  if(tsb< -10) return {l:'In carico', c:'c-warn'};
  if(tsb<=5) return {l:'In equilibrio', c:'c-info'};
  if(tsb<=25) return {l:'Fresco', c:'c-good'};
  return {l:'Molto riposato', c:'c-info'};
}

/* ====================== consigli ====================== */
function zonesSince(since){ const z=[0,0,0,0,0]; for(const a of state.acts){ if(a.start<since||!a.hrHist) continue; hrZoneSecs(a.hrHist).forEach((v,i)=>z[i]+=v); } return z; }
function buildAdvice(){
  const out=[], rides=allRides(), now=Date.now(); if(!rides.length || !state.fitness.length) return out;
  const F=state.fitness, L=F[F.length-1], W=F[Math.max(0,F.length-8)];
  const ramp=L.ctl-W.ctl, hm=hrMaxEff();
  const last=rides[0], daysOff=Math.floor((now-last.start)/DAY);
  if(L.tsb< -30) out.push({c:'bad', t:'Fatica accumulata alta', p:`La forma è a ${nf(L.tsb)}: il corpo ha bisogno di assorbire il lavoro. Fai 1–2 giorni di riposo o solo pedalate facili sotto ${Math.round(hm*0.68)} bpm per non andare in sovrallenamento.`});
  else if(L.tsb< -10) out.push({c:'good', t:'Carico produttivo', p:`Forma a ${nf(L.tsb)}: stai costruendo condizione. Dopo 2–3 giorni intensi inserisci una giornata facile, e ogni 3–4 settimane una settimana di scarico (volume –40%).`});
  else if(L.tsb>15 && L.ctl>25) out.push({c:'good', t:'Sei fresco: momento giusto per spingere', p:`Forma a +${nf(L.tsb)}. È un buon momento per una gara, un test di 20 minuti per aggiornare la FTP o un'uscita lunga impegnativa.`});
  else if(L.tsb>5) out.push({c:'info', t:'Recuperato', p:`Forma a +${nf(L.tsb)}: hai recuperato bene. Se l'obiettivo è migliorare, puoi aumentare un po' il carico questa settimana.`});
  else out.push({c:'info', t:'Carico in equilibrio', p:`Forma a ${nf(L.tsb)}: allenamento e recupero sono bilanciati. Per crescere serve uno stimolo in più, ad esempio un'uscita più lunga o una seduta di ripetute.`});
  if(ramp>8) out.push({c:'warn', t:'Il carico sale troppo in fretta', p:`La condizione (CTL) è cresciuta di ${nf(ramp,1)} punti in 7 giorni. Oltre 6–8 a settimana aumenta il rischio di infortuni e stanchezza: tieni l'aumento tra 3 e 6.`});
  else if(ramp< -4 && daysOff<7) out.push({c:'info', t:'La condizione sta calando', p:`Il CTL è sceso di ${nf(-ramp,1)} punti in una settimana. Va bene se è uno scarico voluto; altrimenti riprendi con 3 uscite regolari a settimana.`});
  if(daysOff>=7) out.push({c:'warn', t:`${daysOff} giorni senza pedalare`, p:'Dopo una pausa riparti con 2–3 uscite facili in Z2 prima di riprendere le salite impegnative.'});
  const z=zonesSince(now-28*DAY), tot=z.reduce((a,b)=>a+b,0);
  if(tot>3*3600){
    const z12=(z[0]+z[1])/tot, z3=z[2]/tot, z45=(z[3]+z[4])/tot;
    if(z3>0.30) out.push({c:'warn', t:'Troppo tempo in "zona grigia"', p:`Nelle ultime 4 settimane il ${nf(z3*100)}% del tempo è in Z3 (${Math.round(HRZ[1]*hm)}–${Math.round(HRZ[2]*hm)} bpm): stanca ma allena poco. Meglio separare: uscite davvero facili in Z2 e 1–2 sedute brevi e intense.`});
    else if(z12<0.55) out.push({c:'warn', t:'Poco fondo lento', p:`Solo il ${nf(z12*100)}% del tempo è in Z1–Z2. La base aerobica si costruisce soprattutto lì: almeno un'uscita a settimana di 2–3 ore sotto ${Math.round(HRZ[1]*hm)} bpm.`});
    else if(z45<0.05) out.push({c:'info', t:'Aggiungi un po\' di intensità', p:`Hai una buona base (${nf(z12*100)}% in Z1–Z2). Per alzare la soglia aggiungi una seduta a settimana, ad esempio 4×4 minuti in Z4–Z5 con 4 minuti di recupero.`});
    else out.push({c:'good', t:'Distribuzione dell\'intensità equilibrata', p:`${nf(z12*100)}% facile, ${nf(z3*100)}% medio, ${nf(z45*100)}% intenso: è una distribuzione vicina a quella dei piani "polarizzati" che funzionano meglio per gli amatori.`});
  }
  const dec=rides.filter(a=>a.decoupling!=null && a.start>now-60*DAY).slice(0,6);
  if(dec.length>=2){ const m=dec.reduce((s,a)=>s+a.decoupling,0)/dec.length;
    if(m>8) out.push({c:'warn', t:'Calo di resistenza nelle uscite lunghe', p:`Nella seconda metà delle uscite il rapporto potenza/battito peggiora del ${nf(m,1)}% (deriva cardiaca). Sotto il 5% è ottimo: lavora sulla resistenza con uscite lunghe a ritmo costante, e cura idratazione e alimentazione (60–80 g di carboidrati all'ora).`});
    else if(m<5) out.push({c:'good', t:'Ottima resistenza aerobica', p:`La deriva cardiaca media è ${nf(m,1)}%: il battito resta stabile anche nella seconda metà delle uscite.`}); }
  const est=ftpEst();
  if(est){ const wkg=est/profile.weight;
    if(!profile.ftp) out.push({c:'info', t:`FTP stimata: ${est} W (${nf(wkg,2)} W/kg)`, p:'Calcolata come 95% della tua migliore potenza su 20 minuti negli ultimi 4 mesi. Per zone più precise fai un test e inseriscila nel profilo.'});
    else if(est>profile.ftp*1.03) out.push({c:'good', t:'Sei migliorato: aggiorna la FTP', p:`Dai tuoi ultimi 20 minuti migliori risulta una FTP di circa ${est} W, più dei ${profile.ftp} W impostati. Aggiornala nel profilo così zone e carico restano corretti.`}); }
  const recent=rides.filter(a=>a.start>now-28*DAY);
  const perWeek=recent.length/4; if(perWeek<2) out.push({c:'info', t:'Più costanza', p:`Nelle ultime 4 settimane hai fatto in media ${nf(perWeek,1)} uscite a settimana. 3 uscite regolari valgono più di una sola uscita lunghissima.`});
  const cads=recent.filter(a=>a.avgCad && a.sub!=='mtb'); if(cads.length>=3){ const m=cads.reduce((s,a)=>s+a.avgCad,0)/cads.length; if(m<75) out.push({c:'info', t:'Pedalata un po\' "dura"', p:`Cadenza media ${nf(m)} rpm su strada. Prova rapporti più agili (85–95 rpm) in pianura: affatichi meno i muscoli e risparmi le gambe per le salite.`}); }
  return out;
}

/* ====================== disegni SVG ====================== */
function routeSVG(track, w, h, mini){
  if(!track || track.length<2) return `<svg viewBox="0 0 ${w} ${h}" class="${mini?'':'map'}" aria-hidden="true"><text x="${w/2}" y="${h/2}" text-anchor="middle" fill="var(--muted)" font-size="${mini?9:14}">${mini?'—':'Nessun GPS'}</text></svg>`;
  const lat0=track.reduce((s,p)=>s+p[0],0)/track.length, k=Math.cos(lat0*Math.PI/180);
  const xs=track.map(p=>p[1]*k), ys=track.map(p=>-p[0]);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const pad=mini?4:24, sc=Math.min((w-2*pad)/((maxx-minx)||1e-6), (h-2*pad)/((maxy-miny)||1e-6));
  const ox=(w-(maxx-minx)*sc)/2, oy=(h-(maxy-miny)*sc)/2;
  const pts=xs.map((x,i)=>[((x-minx)*sc+ox).toFixed(1), ((ys[i]-miny)*sc+oy).toFixed(1)]);
  const d='M'+pts.map(p=>p.join(',')).join('L');
  if(mini) return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>`;
  let grid=''; for(let i=1;i<6;i++) grid+=`<line x1="${i*w/6}" y1="0" x2="${i*w/6}" y2="${h}" stroke="var(--line)" stroke-width="1"/>`; for(let i=1;i<4;i++) grid+=`<line x1="0" y1="${i*h/4}" x2="${w}" y2="${i*h/4}" stroke="var(--line)" stroke-width="1"/>`;
  const s=pts[0], e=pts[pts.length-1];
  const kmW=hav(lat0,minx/k,lat0,maxx/k)/1000;
  return `<svg viewBox="0 0 ${w} ${h}" class="map" role="img" aria-label="Percorso">${grid}
    <path d="${d}" fill="none" stroke="var(--bg)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${s[0]}" cy="${s[1]}" r="7" fill="var(--good)" stroke="var(--bg)" stroke-width="2"/>
    <rect x="${e[0]-6}" y="${e[1]-6}" width="12" height="12" fill="var(--fg)" stroke="var(--bg)" stroke-width="2"/>
    <text x="${w-12}" y="${h-12}" text-anchor="end" fill="var(--muted)" font-size="12">larghezza ≈ ${nf(kmW,1)} km · N ↑</text></svg>`;
}

function ranking(cat, since=0, n=10){
  return cycling().filter(a=>a.start>=since).map(a=>({a, v:cat.v(a)})).filter(x=>x.v!=null && isFinite(x.v) && x.v>0).sort((x,y)=>y.v-x.v).slice(0,n);
}
// medaglie: posizione 1-3 di sempre e 1-3 dell'anno dell'uscita
function computeMedals(){
  state.medals={};
  const add=(id,m)=>(state.medals[id]=state.medals[id]||[]).push(m);
  const years=[...new Set(cycling().map(a=>new Date(a.start).getFullYear()))];
  for(const c of CATS){
    ranking(c,0,3).forEach((x,i)=>add(x.a.id,{c, rank:i, scope:'sempre'}));
    for(const y of years){
      const from=new Date(y,0,1).getTime(), to=new Date(y+1,0,1).getTime();
      cycling().filter(a=>a.start>=from&&a.start<to).map(a=>({a,v:c.v(a)})).filter(x=>x.v!=null&&isFinite(x.v)&&x.v>0).sort((p,q)=>q.v-p.v).slice(0,3)
        .forEach((x,i)=>{ if(!(state.medals[x.a.id]||[]).some(m=>m.c===c)) add(x.a.id,{c, rank:i, scope:String(y)}); });
    }
  }
  for(const id in state.medals) state.medals[id].sort((p,q)=>(p.scope==='sempre'?0:1)-(q.scope==='sempre'?0:1) || p.rank-q.rank);
}

// coppe: traguardi di una singola uscita e totali
function trophies(){
  const r=cycling(), y0=new Date(new Date().getFullYear(),0,1).getTime();

  const sumBy=(arr,f)=>arr.reduce((s,a)=>s+f(a),0);
  const yr=r.filter(a=>a.start>=y0), kmY=sumBy(yr,a=>a.distance/1000), gY=sumBy(yr,a=>a.gain), kmAll=sumBy(r,a=>a.distance/1000);
  const months=new Map(); for(const a of r){ const k=new Date(a.start).getFullYear()*12+new Date(a.start).getMonth(); months.set(k,(months.get(k)||0)+a.gain); }

    tot('ev','Everest in un mese','8.849 m di dislivello nello stesso mese',bestMonth,8849,'m'),

async function shrinkImage(blob, max=1600){
  const bmp=await createImageBitmap(blob);
  const k=Math.min(1, max/Math.max(bmp.width,bmp.height)), w=Math.round(bmp.width*k), h=Math.round(bmp.height*k);
  const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(bmp,0,0,w,h); bmp.close&&bmp.close();
  return await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
}
async function savePhoto(a, blob){
  let b; try{ b=await shrinkImage(blob); }catch(e){ return null; }   // formati non leggibili (es. HEIC su Android) vengono saltati
  if(!b) return null;
  const id=a.id+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  await DB.mPut({id, actId:a.id, blob:b});
  (a.photoIds=a.photoIds||[]).push(id);
  return id;
}
const photoURLs=new Map();
async function photoSrcs(a){
  const out=[];
  for(const id of a.photoIds||[]){ if(!photoURLs.has(id)){ const m=await DB.mGet(id); if(m&&m.blob) photoURLs.set(id, URL.createObjectURL(m.blob)); } if(photoURLs.has(id)) out.push({src:photoURLs.get(id), id}); }
  for(const u of a.photoUrls||[]) out.push({src:u});
  return out;
}
async function fillGallery(a){
  const g=$('#gallery'); if(!g) return;

  g.innerHTML=ph.map((p,i)=>`<button class="ph" data-ph="${i}"><img src="${esc(p.src)}" alt="Foto ${i+1} dell'uscita" loading="lazy"></button>`).join('');
  g.onclick=e=>{ const b=e.target.closest('[data-ph]'); if(b) openLightbox(ph, +b.dataset.ph, a); };
}
function openLightbox(ph, i, a){
  const o=document.createElement('div'); o.className='lightbox'; o.setAttribute('role','dialog'); o.setAttribute('aria-label','Foto');
  const draw=()=>{ o.innerHTML=`<img src="${esc(ph[i].src)}" alt="Foto ${i+1}"><div class="lb-bar"><button data-lb="prev" ${i?'':'disabled'}>‹</button><span>${i+1} / ${ph.length}</span><button data-lb="next" ${i<ph.length-1?'':'disabled'}>›</button>${ph[i].id?'<button data-lb="del" class="danger">Elimina</button>':''}<button data-lb="close">Chiudi</button></div>`; };
  draw(); document.body.append(o);
  let x0=null; o.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true});
  o.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(dx<-50&&i<ph.length-1){ i++; draw(); } else if(dx>50&&i>0){ i--; draw(); } x0=null; });

function dataPanel(a){
  const hasProf=a.prof&&a.prof.d&&a.prof.d.length>1;
  const ch=(on,l)=>`<span class="chip ${on?'c-good':'c-muted'}">${on?'✓':'✗'} ${l}</span>`;
  const items=[[a.track&&a.track.length>1,'GPS'],[!!a.avgHr,'Battito'],[!!a.avgCad,'Cadenza'],[!!a.avgPw,'Potenza'],[a.maxAlt!=null,'Altitudine']];
  const missing=items.filter(x=>!x[0]).map(x=>x[1].toLowerCase());
  let why='';
  if(a.importNote) why=a.importNote;
  else if(!hasProf && a.stravaId) why='Di questa uscita ho solo il riepilogo di Strava, senza i dati registrati secondo per secondo.';
  else if(missing.length && missing.length<items.length) why=`Il file registrato non contiene: ${missing.join(', ')}. Di solito significa che durante l'uscita il sensore (fascia cardio, sensore di cadenza o misuratore di potenza) non era collegato.`;
  const canRepair=a.stravaId && !hasProf && !EMBEDDED && STRAVA.refresh;
  return `<div class="panel"><h3>Dati registrati</h3><div class="toolbar">${items.map(x=>ch(x[0],x[1])).join('')}</div>${why?`<p class="small muted">${esc(why)}</p>`:''}${canRepair?'<p><button class="primary" id="repair">Scarica i dettagli da Strava</button></p>':''}</div>`;
}
function splitsHTML(a){
  const P=a.prof; if(!P||!P.t||P.t.length<2||kindOf(a)==='spin') return '';
  const totKm=P.d[P.d.length-1]; if(totKm<1.5) return '';
  const at=(km,arr)=>{ let i=1; while(i<P.d.length-1 && P.d[i]<km) i++; const d0=P.d[i-1], d1=P.d[i]; const f=d1>d0? (km-d0)/(d1-d0) : 0; return arr[i-1]+(arr[i]-arr[i-1])*Math.max(0,Math.min(1,f)); };
  const rows=[]; let prevT=0, prevKm=0;
  for(let k=1; k<=Math.ceil(totKm); k++){
    const km=Math.min(k,totKm), t=at(km,P.t), dt=t-prevT, dk=km-prevKm; if(dk<0.2) break;
    let up=0, hr=0, hn=0, prevA=null;
    for(let i=0;i<P.d.length;i++){ if(P.d[i]<prevKm||P.d[i]>km) continue; const al=P.alt[i]; if(al!=null){ if(prevA!=null&&al>prevA) up+=al-prevA; prevA=al; } if(P.hr[i]){ hr+=P.hr[i]; hn++; } }
    rows.push({k:km, dk, dt, v:dt>0? dk/dt*3600 : 0, up, hr:hn? hr/hn : null}); prevT=t; prevKm=km;
  }
  const best=Math.max(...rows.filter(r=>r.dk>=0.9).map(r=>r.v));
  const body=rows.map(r=>`<tr><td>${nf(r.k,r.k%1?1:0)}</td><td>${fmtDur(r.dt)}</td><td class="${r.v===best?'best':''}">${nf(r.v,1)}</td><td>${nf(r.up)}</td><td>${r.hr?nf(r.hr):'–'}</td></tr>`).join('');
  return `<div class="panel"><details ${rows.length<=25?'open':''}><summary><h3 style="display:inline">Parziali per km</h3> <span class="small muted">${rows.length} km · più veloce ${nf(best,1)} km/h</span></summary><div class="tablewrap"><table class="gt splits"><thead><tr><th>km</th><th>Tempo</th><th>km/h</th><th>D+ m</th><th>FC</th></tr></thead><tbody>${body}</tbody></table></div></details></div>`;
}

function weekAgg(from, to){ const r=cycling().filter(a=>a.start>=from && a.start<to); return {n:r.length, km:r.reduce((s,a)=>s+a.distance,0)/1000, gain:r.reduce((s,a)=>s+a.gain,0), time:r.reduce((s,a)=>s+a.moving,0)}; }
function delta(a,b,unit,d=0){ if(!b) return ''; const x=a-b; return `${x>=0?'+':'−'}${nf(Math.abs(x),d)} ${unit} rispetto alla scorsa`; }
function records(){
  const r=cycling(); const by=(f,filter=()=>true)=>{ let b=null; for(const a of r) if(filter(a) && f(a)!=null && (!b||f(a)>f(b))) b=a; return b; };
  return {dist:by(a=>a.distance), gain:by(a=>a.gain), time:by(a=>a.moving), spd:by(a=>a.avgSpd, a=>a.distance>20000), alt:by(a=>a.maxAlt)};

  const now=Date.now(), ws=weekStart(now), tw=weekAgg(ws, now+DAY), pw=weekAgg(ws-7*DAY, ws);

function actInsights(a){
  const out=[], ftp=ftpEff(), t=tss(a);

  if(a.np && ftp){ const IF=a.np/ftp, VI=a.np/a.avgPw;

  return out;
}

async function exportBackup(){
  const acts=state.acts.filter(a=>!a.isExample);
  const json=JSON.stringify({app:'quaderno-pedalate', v:1, created:new Date().toISOString(), profile, acts, friends:state.friends||[]});
  const d=new Date(), name=`quaderno-pedalate-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  // Il menu Condividi accetta i file di testo su Android e iPhone; altrimenti si scarica il file compresso.
  const txt=new File([json], name+'.txt', {type:'text/plain'});
  if(navigator.canShare && navigator.canShare({files:[txt]})){
    try{ await navigator.share({files:[txt], title:'Backup Quaderno Pedalate'}); store('qp-lastBackup',Date.now()); return `Backup condiviso (${nf(json.length/1048576,1)} MB). Controlla di averlo salvato su Drive.`; }
    catch(e){ if(e.name==='AbortError') return 'Backup annullato.'; }
  }
  let blob=new Blob([json],{type:'application/json'}), fname=name+'.json';
  if(typeof CompressionStream!=='undefined'){ blob=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); fname+='.gz'; }
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=fname; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000);
  store('qp-lastBackup',Date.now());
  return `File ${fname} scaricato: caricalo su Google Drive dall'app Drive (+ → Carica).`;
}
async function restoreBackup(file){
  let buf=await file.arrayBuffer();
  if(file.name.toLowerCase().endsWith('.gz')) buf=await gunzip(buf);
  let data; try{ data=JSON.parse(new TextDecoder().decode(buf)); }catch(e){ throw new Error('non è un backup valido'); }
  if(data.app==='quaderno-pedalate-amico'){ const fr=addFriendData(data); return `Scheda di ${fr.f.name} ${fr.updated?'aggiornata':'aggiunta'} nel Gruppo`; }
  if(data.app!=='quaderno-pedalate' || !Array.isArray(data.acts)) throw new Error('non è un backup di Quaderno Pedalate');
  if(Array.isArray(data.friends)) for(const f of data.friends){ try{ if(!state.friends.some(x=>x.id===f.id)) addFriendData(Object.assign({app:'quaderno-pedalate-amico'},f)); }catch(e){} }
  if(state.examples){ state.acts=[]; state.examples=false; }
  const have=new Set(state.acts.map(a=>a.id)); let k=0;
  for(const a of data.acts){ if(!a || !a.id || have.has(a.id)) continue; state.acts.push(a); have.add(a.id); await DB.put(a); k++; }
  if(data.profile && (!store('qp-profile') || !(profile.first||profile.photo))){ Object.assign(profile, data.profile); store('qp-profile', profile); renderMe(); }
  state.acts.sort((a,b)=>b.start-a.start); recompute();
  return k;
}
function bindBackup(){
  const b=$('#b-exp'); if(b) b.onclick=async()=>{ b.disabled=true; $('#b-msg').textContent='Preparo il backup…'; try{ $('#b-msg').textContent=await exportBackup(); }catch(e){ $('#b-msg').textContent='Errore: '+e.message; } b.disabled=false; };
  const i=$('#b-imp'); if(i) i.onchange=async()=>{ const f=i.files[0]; i.value=''; if(!f) return; $('#b-msg').textContent='Ripristino in corso…'; try{ const k=await restoreBackup(f); if(typeof k!=='string') store('qp-lastBackup', store('qp-lastBackup')||Date.now()); renderAll(); const m=$('#b-msg'); if(m) m.textContent= typeof k==='string'? k+'.' : `Ripristino completato: ${k} attività aggiunte.`; }catch(e){ $('#b-msg').textContent='Errore: '+e.message; } };
}

/* ====================== collegamento diretto a Strava ====================== */
const STRAVA = Object.assign({clientId:'', clientSecret:'', access:null, refresh:null, expiresAt:0, athlete:null, queue:[], lastSync:0, win:{start:0,n:0}, pendingCode:null}, store('qp-strava')||{});
const saveStrava = () => store('qp-strava', STRAVA);
const redirectUri = () => location.origin + location.pathname;
class RateLimit extends Error{ constructor(until){ super('limite'); this.until=until; } }
function setSync(msg){ state.syncMsg=msg; const el=$('#s-status'); if(el) el.textContent=msg; }
function stravaConnect(){
  const u=new URL('https://www.strava.com/oauth/authorize');
  u.search=new URLSearchParams({client_id:STRAVA.clientId, redirect_uri:redirectUri(), response_type:'code', approval_prompt:'auto', scope:'read,activity:read_all'}).toString();
  location.href=u.toString();
}
async function stravaToken(params){
  let r;
  try{ r=await fetch('https://www.strava.com/oauth/token',{method:'POST', body:new URLSearchParams(Object.assign({client_id:STRAVA.clientId, client_secret:STRAVA.clientSecret}, params))}); }
  catch(e){ throw new Error('nessuna connessione con Strava'); }
  if(!r.ok) throw new Error(r.status===400||r.status===401 ? 'Strava ha rifiutato i dati: controlla Client ID e Client Secret, poi ricollega.' : 'errore Strava '+r.status);
  const j=await r.json();
  STRAVA.access=j.access_token; STRAVA.refresh=j.refresh_token; STRAVA.expiresAt=j.expires_at;
  if(j.athlete) STRAVA.athlete={name:[j.athlete.firstname,j.athlete.lastname].filter(Boolean).join(' ')};
  saveStrava();
}
// Ritorno da Strava dopo l'autorizzazione (?code=...)
async function stravaHandleRedirect(){
  const p=new URLSearchParams(location.search); if(!p.has('code') && !p.has('error')) return false;
  history.replaceState(null,'',location.pathname+'#importa');
  if(p.get('error')){ setSync('Collegamento annullato su Strava.'); return true; }
  if(!(p.get('scope')||'').includes('activity:read')){ setSync('Per scaricare le attività devi lasciare spuntata l\'autorizzazione "attività" su Strava. Riprova.'); return true; }
  if(!STRAVA.clientId || !STRAVA.clientSecret){ STRAVA.pendingCode=p.get('code'); saveStrava(); setSync(''); return true; }
  try{ await stravaToken({code:p.get('code'), grant_type:'authorization_code'}); STRAVA.pendingCode=null; saveStrava(); setSync('Strava collegato. Avvio il download delle attività…'); setTimeout(()=>stravaSync('new'),300); }
  catch(e){ setSync('Errore: '+e.message); }
  return true;
}
async function sGet(path, params={}){
  if(!STRAVA.access || Date.now()/1000 > STRAVA.expiresAt-300){ if(!STRAVA.refresh) throw new Error('Strava non è collegato'); await stravaToken({grant_type:'refresh_token', refresh_token:STRAVA.refresh}); }
  const now=Date.now(), ws=Math.floor(now/900000)*900000;
  if(STRAVA.win.start!==ws) STRAVA.win={start:ws, n:0};
  if(STRAVA.win.n>=95) throw new RateLimit(ws+900000+5000);
  STRAVA.win.n++; saveStrava();
  const u=new URL('https://www.strava.com/api/v3'+path);
  for(const k in params) u.searchParams.set(k, params[k]);
  u.searchParams.set('access_token', STRAVA.access);
  let r; try{ r=await fetch(u.toString()); }catch(e){ throw new Error('connessione a Strava non riuscita (sei online?)'); }
  if(r.status===429) throw new RateLimit(ws+900000+5000);
  if(r.status===401){ STRAVA.access=null; saveStrava(); throw new Error('accesso a Strava scaduto: tocca "Scollega" e ricollega l\'account'); }
  if(r.status===404) return null;
  if(!r.ok) throw new Error('errore Strava '+r.status);
  return r.json();
}
function stravaSport(t){
  t=String(t||'');
  if(/^(Ride|EBikeRide|Velomobile|Handcycle)$/.test(t)) return {sport:'ride', sub:'road'};
  if(/MountainBike/.test(t)) return {sport:'ride', sub:'mtb'};
  if(t==='GravelRide') return {sport:'ride', sub:'gravel'};
  if(t==='VirtualRide') return {sport:'ride', sub:'virtual'};
  if(/Run/.test(t)) return {sport:'run'};
  if(/Walk|Hike/.test(t)) return {sport:'walk'};
  return {sport:'other'};
}
function summaryAct(it){
  const st=it.trainer? {sport:'ride', sub:'indoor'} : stravaSport(it.type);
  return {stype:it.type||null, trainer:!!it.trainer, avgCad:it.avgCad||null, maxPw:it.maxPw||null, id:'a'+Math.round(it.start/1000), name:it.name||'Attività', sport:st.sport, sub:st.sub||null, source:'Strava', start:it.start, distance:it.distance||0, moving:it.moving||it.elapsed||0, elapsed:it.elapsed||0, gain:it.gain||0, maxAlt:it.maxAlt??null, minAlt:null, avgSpd:it.moving? (it.distance||0)/it.moving*3.6 : 0, maxSpd:(it.maxSpd||0)*3.6, avgHr:it.avgHr||null, maxHr:it.maxHr||null, avgPw:it.avgPw||null, prof:{d:[],alt:[],spd:[],hr:[],pw:[],cad:[]}, track:[], stravaId:it.id};
}
async function stravaFetchOne(it){
  const s=await sGet(`/activities/${it.id}/streams`, {keys:'time,latlng,altitude,heartrate,watts,cadence,distance,velocity_smooth', key_by_type:'true'});
  const st=it.trainer? {sport:'ride', sub:'indoor'} : stravaSport(it.type);
  if(s && s.time && s.time.data && s.time.data.length>=10){
    const T=s.time.data, g=k=>s[k] && s[k].data, LL=g('latlng'), AL=g('altitude'), HR=g('heartrate'), PW=g('watts'), CA=g('cadence'), DI=g('distance'), VS=g('velocity_smooth');
    const t0=it.start/1000, recs=[];
    for(let i=0;i<T.length;i++){ const r={t:t0+T[i]}; if(LL&&LL[i]){ r.lat=LL[i][0]; r.lon=LL[i][1]; } if(AL) r.alt=AL[i]; if(HR) r.hr=HR[i]; if(PW) r.pw=PW[i]; if(CA) r.cad=CA[i]; if(DI) r.dist=DI[i]; if(VS) r.spd=VS[i]; recs.push(r); }
    try{
      const a=processRecords(recs, {name:it.name, sport:st.sport, sub:st.sub, source:'Strava'});
      // Valori ufficiali di Strava, così i numeri coincidono con quelli dell'app Strava
      if(it.distance) a.distance=it.distance; if(it.moving) a.moving=it.moving; if(it.elapsed) a.elapsed=it.elapsed; if(it.gain!=null) a.gain=it.gain;
      a.avgSpd=a.moving? a.distance/a.moving*3.6 : 0; a.stravaId=it.id; a.stype=it.type||null; a.trainer=!!it.trainer;
      return a;
    }catch(e){ const x=summaryAct(it); x.importNote='I dati dettagliati di Strava non si sono potuti leggere ('+e.message+').'; return x; }
  }

async function stravaSync(mode){
  if(state.syncing || EMBEDDED) return;
  state.syncing=true; state.stopSync=false; refreshStravaPanel();
  try{
    if(mode==='new' || mode==='all'){
      setSync('Controllo le attività su Strava…');
      const real=state.acts.filter(a=>!a.isExample);
      const after = mode==='all' ? 0 : Math.floor(Math.max(0, ...real.map(a=>a.start), STRAVA.lastListed||0)/1000);
      const have=new Set(real.map(a=>Math.round(a.start/60000))), queued=new Set(STRAVA.queue.map(q=>q.id));
      let page=1, found=0;
      while(true){
        const list=await sGet('/athlete/activities', {after, per_page:200, page});
        if(!list || !list.length) break;
        for(const x of list){
          const start=Date.parse(x.start_date), key=Math.round(start/60000);
          if(have.has(key)||have.has(key-1)||have.has(key+1)||queued.has(x.id)) continue;
          STRAVA.queue.push({id:x.id, name:x.name, type:x.sport_type||x.type, start, distance:x.distance, moving:x.moving_time, elapsed:x.elapsed_time, gain:x.total_elevation_gain, maxSpd:x.max_speed, avgHr:x.average_heartrate, maxHr:x.max_heartrate, avgPw:x.device_watts? x.average_watts : null, maxAlt:x.elev_high, avgCad:x.average_cadence, maxPw:x.device_watts? x.max_watts : null, manual:!!x.manual, trainer:!!x.trainer, photos:x.total_photo_count||0});
          queued.add(x.id); found++;
        }
        if(list.length<200) break; page++;
      }
      // uscite di Strava rimaste senza dettagli: le riscarico
      for(const a of state.acts){ if(a.stravaId && !(a.prof&&a.prof.d&&a.prof.d.length>1) && !a.repairTried && !STRAVA.queue.some(q=>q.id===a.stravaId)){ STRAVA.queue.push({id:a.stravaId, name:a.name, type:a.stype||(a.sub==='mtb'?'MountainBikeRide':a.sub==='gravel'?'GravelRide':a.sport==='ride'?'Ride':a.sport), start:a.start, distance:a.distance, moving:a.moving, elapsed:a.elapsed, gain:a.gain, maxSpd:(a.maxSpd||0)/3.6, avgHr:a.avgHr, maxHr:a.maxHr, avgPw:a.avgPw, maxAlt:a.maxAlt, trainer:!!a.trainer || a.sub==='indoor', repair:a.id}); found++; } }
      STRAVA.queue.sort((a,b)=>b.start-a.start); saveStrava();
      setSync(found? `${found} attività nuove trovate. Scarico i dettagli…` : 'Nessuna attività nuova su Strava.');
    }
    let done=0;
    if(STRAVA.queue.length && state.examples){ state.acts=[]; state.examples=false; }
    while(STRAVA.queue.length && !state.stopSync){
      const it=STRAVA.queue[0];
      const a = it.manual ? summaryAct(it) : await stravaFetchOne(it);
      if(it.photos>0){ try{ const ph=await sGet(`/activities/${it.id}/photos`, {size:'1024', photo_sources:'true'}); a.photoUrls=(ph||[]).map(x=>x.urls && (x.urls['1024']||Object.values(x.urls).pop())).filter(Boolean); }catch(e){ if(e instanceof RateLimit) throw e; } }
      if(it.repair){ const old=state.acts.find(x=>x.id===it.repair); if(old){ for(const k of ['photoIds','photoUrls','name']) if(old[k]) a[k]=old[k]; if(!(a.prof&&a.prof.d&&a.prof.d.length>1)) a.repairTried=true; if(a.id!==old.id){ await DB.del(old.id); } Object.keys(old).forEach(k=>delete old[k]); Object.assign(old,a); await DB.put(old); } }
      else if(!state.acts.some(x=>x.id===a.id)){ state.acts.push(a); await DB.put(a); }
      STRAVA.queue.shift(); saveStrava(); done++;
      setSync(`Scaricate ${done} attività · ne restano ${STRAVA.queue.length}`);
      if(done%10===0){ state.acts.sort((a,b)=>b.start-a.start); recompute(); }
    }
    STRAVA.lastSync=Date.now(); saveStrava();
    if(!state.stopSync) setSync(done? `Fatto: ${done} attività scaricate da Strava.` : (state.syncMsg||'Tutto aggiornato.'));
    else setSync(`Download in pausa: ${STRAVA.queue.length} attività ancora in coda.`);
  }catch(e){
    if(e instanceof RateLimit){
      const wait=Math.max(10000, e.until-Date.now());
      setSync(`Strava permette circa 100 download ogni 15 minuti: riprendo da solo alle ${fmtTime(e.until)} (tieni l'app aperta, oppure riprenderà alla prossima apertura). In coda: ${STRAVA.queue.length}.`);
      clearTimeout(state.syncTimer); state.syncTimer=setTimeout(()=>stravaSync('resume'), wait);
    } else setSync('Errore: '+e.message);
  }
  state.syncing=false;
  state.acts.sort((a,b)=>b.start-a.start); recompute();
  renderAll();
}

function bindStrava(){
  const c=$('#s-connect');
  if(c) c.onclick=async()=>{
    STRAVA.clientId=$('#s-id').value.trim(); STRAVA.clientSecret=$('#s-secret').value.trim(); saveStrava();
    if(!/^\d+$/.test(STRAVA.clientId) || STRAVA.clientSecret.length<20){ setSync('Controlla i dati: il Client ID è un numero, il Client Secret è un codice lungo di lettere e numeri.'); return; }
    if(STRAVA.pendingCode){ try{ await stravaToken({code:STRAVA.pendingCode, grant_type:'authorization_code'}); STRAVA.pendingCode=null; saveStrava(); refreshStravaPanel(); stravaSync('new'); }catch(e){ STRAVA.pendingCode=null; saveStrava(); setSync('Errore: '+e.message); } return; }
    stravaConnect();
  };
  const pp=$('#s-paste-ok');
  if(pp) pp.onclick=async()=>{
    const m=($('#s-paste').value||'').match(/[?&]code=([^&#\s]+)/); if(!m){ setSync('Nell\'indirizzo incollato non trovo il codice (code=…).'); return; }
    STRAVA.clientId=$('#s-id').value.trim(); STRAVA.clientSecret=$('#s-secret').value.trim(); saveStrava();
    try{ await stravaToken({code:decodeURIComponent(m[1]), grant_type:'authorization_code'}); refreshStravaPanel(); stravaSync('new'); }catch(e){ setSync('Errore: '+e.message+' (il codice vale una sola volta: se serve, ricollega da capo).'); }
  };
  const n=$('#s-new'); if(n) n.onclick=()=>stravaSync('new');
  const a=$('#s-all'); if(a) a.onclick=()=>stravaSync('all');
  const st=$('#s-stop'); if(st) st.onclick=()=>{ state.stopSync=true; clearTimeout(state.syncTimer); setSync('Metto in pausa…'); };
  const o=$('#s-off'); if(o) o.onclick=()=>{ Object.assign(STRAVA,{access:null, refresh:null, expiresAt:0, athlete:null, queue:[]}); saveStrava(); clearTimeout(state.syncTimer); setSync(''); refreshStravaPanel(); };
}

function goalsHTML(){
  const g=profile.goals||{}, set=GOALS.filter(x=>g[x.k]>0);
  if(!set.length) return `<div class="panel"><h3>Obiettivi</h3><p class="small muted">Imposta un obiettivo (ad esempio 3.000 km quest'anno) e qui vedi a che punto sei.</p><p><button data-go="profilo">Imposta obiettivi</button></p></div>`;

}

const SOURCES=[

function aggr(list){
  const n=list.length, km=list.reduce((s,a)=>s+a.distance,0)/1000, gain=list.reduce((s,a)=>s+(a.gain||0),0), time=list.reduce((s,a)=>s+(a.moving||0),0);
  const hrL=list.filter(a=>a.avgHr), hr=hrL.length? hrL.reduce((s,a)=>s+a.avgHr*a.moving,0)/hrL.reduce((s,a)=>s+a.moving,0) : null;
  const kc=list.reduce((s,a)=>s+(kcal(a)||0),0);
  return {n, km, gain, time, hr, kcal:kc, spd: time? km/(time/3600) : null};
}
function statsSince(p){ const n=new Date(); return p==='anno'? new Date(n.getFullYear(),0,1).getTime() : p==='12m'? Date.now()-365*DAY : p==='90'? Date.now()-90*DAY : 0; }
const mean=arr=>arr.length? arr.reduce((s,x)=>s+x,0)/arr.length : null;

const IND=[

  {k:'ctl', l:'Condizione (Fitness)', u:'', d:0, better:1, why:'Media del carico degli ultimi 42 giorni.'},
  {k:'spd', l:'Velocità media in bici (uscite oltre 15 km)', u:'km/h', d:1, better:1, f:L=>mean(L.filter(a=>kindOf(a)==='bike'&&a.distance>15000&&a.avgSpd).map(a=>a.avgSpd)), why:'Dipende anche dal percorso: guardala insieme alla salita.'},
  {k:'vam', l:'Velocità in salita (VAM, uscite con almeno 15 m/km)', u:'m/h', d:0, better:1, f:L=>mean(L.filter(a=>kindOf(a)==='bike'&&a.gain>300&&a.distance>5000&&a.gain/(a.distance/1000)>=15&&a.moving).map(a=>a.gain/(a.moving/3600))), why:'Metri di dislivello guadagnati per ora: il miglior indice per chi fa MTB.'},
