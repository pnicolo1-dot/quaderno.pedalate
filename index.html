  {k:'pef', l:'Efficienza: watt per battito', u:'W/bpm', d:2, better:1, f:L=>{ const x=L.filter(a=>(a.np||a.avgPw)&&a.avgHr>90); return x.length>=2? mean(x.map(a=>(a.np||a.avgPw)/a.avgHr)) : null; }, why:'Il "fattore di efficienza" usato dagli allenatori: più alto è meglio.'},
  {k:'p20', l:'Potenza migliore 20 minuti', u:'W', d:0, better:1, f:L=>{ const i=WINDOWS.indexOf(1200); const v=L.map(a=>a.best&&a.best[i]).filter(Boolean); return v.length? Math.max(...v) : null; }, why:'Stima della tua soglia (FTP ≈ 95%).'},
  {k:'dec', l:'Deriva cardiaca nelle uscite lunghe', u:'%', d:1, better:-1, f:L=>{ const v=L.map(a=>a.decoupling).filter(x=>x!=null); return v.length>=2? mean(v) : null; }, why:'Quanto sale il battito nella seconda metà: più bassa = più resistenza.'}
];
function improvement(days=90){
  const now=Date.now(), rides=allRides();
  const A=rides.filter(a=>a.start>=now-days*DAY), B=rides.filter(a=>a.start>=now-2*days*DAY && a.start<now-days*DAY);
  const Y=rides.filter(a=>a.start>=now-365*DAY-days*DAY && a.start<now-365*DAY);
  const F=state.fitness, ctlAt=t=>{ const f=[...F].reverse().find(x=>x.d<=t); return f? f.ctl : null; };
  const rows=IND.map(m=>{
    const cur=m.k==='ctl'? ctlAt(now) : m.f(A,days), prev=m.k==='ctl'? ctlAt(now-days*DAY) : m.f(B,days), ly=m.k==='ctl'? ctlAt(now-365*DAY) : m.f(Y,days);
    let pct=null, verdict='n';
    if(cur!=null && prev){ pct=(cur-prev)/Math.abs(prev)*100; const s=pct*m.better; verdict= s>2? 'up' : s<-2? 'down' : 'eq'; }
    return {m, cur, prev, ly, pct, verdict};
  }).filter(r=>r.cur!=null || r.prev!=null);
  const up=rows.filter(r=>r.verdict==='up').length, down=rows.filter(r=>r.verdict==='down').length;
  let title, text, cls;
  if(!A.length){ title='Nessuna uscita negli ultimi '+days+' giorni'; text='Riprendi a pedalare con regolarità e torna qui fra qualche settimana.'; cls='c-warn'; }
  else if(!B.length){ title='Confronto non ancora possibile'; text=`Non ci sono uscite nei ${days} giorni prima da confrontare. Importa lo storico da Strava (o aspetta qualche settimana) e qui vedrai se stai migliorando.`; cls='c-info'; }
else if(up>=down+2){ title='Sì, stai migliorando'; text=`${up} indicatori su ${rows.length} sono migliori rispetto ai ${days} giorni precedenti.`; cls='c-good'; }
  else if(down>=up+2){ title='In questo periodo sei calato'; text=`${down} indicatori su ${rows.length} sono peggiori rispetto ai ${days} giorni precedenti. Spesso dipende da meno ore in sella o da stanchezza.`; cls='c-bad'; }
  else { title='Sei stabile'; text=`${up} indicatori migliorano e ${down} peggiorano: stai mantenendo la condizione. Per crescere serve uno stimolo nuovo (vedi il piano qui sotto).`; cls='c-info'; }
  return {rows, up, down, title, text, cls, nA:A.length, nB:B.length};
}
function monthly(n=12){
  const out=[], d=new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-(n-1));
  for(let i=0;i<n;i++){ const s=d.getTime(); d.setMonth(d.getMonth()+1); const e=d.getTime(); const L=cycling().filter(a=>a.start>=s&&a.start<e);
    const g=aggr(L), v=IND.find(m=>m.k==='vam').f(L), ef=IND.find(m=>m.k==='ef').f(L);
    out.push({s, label:MESI[new Date(s).getMonth()]+(new Date(s).getMonth()===0||i===0?' '+String(new Date(s).getFullYear()).slice(2):''), ...g, vam:v, ef}); }
  return out;
}
// profilo dell'atleta e piano
function athlete(){
  const now=Date.now(), L=allRides().filter(a=>a.start>=now-56*DAY);
  const hours=L.reduce((s,a)=>s+a.moving,0)/3600/8, perWeek=L.length/8;
  const z=zonesSince(now-56*DAY), tot=z.reduce((a,b)=>a+b,0);
  const zs= tot>2*3600? {z12:(z[0]+z[1])/tot, z3:z[2]/tot, z45:(z[3]+z[4])/tot} : null;
  const dec=mean(L.map(a=>a.decoupling).filter(x=>x!=null));
  const longest=Math.max(0,...L.map(a=>a.moving/3600));
  const mtb=L.filter(a=>a.sub==='mtb'||a.gain/(Math.max(1,a.distance)/1000)>=15).length>=L.length/2;
  return {L, hours, perWeek, zs, dec, longest, mtb};
}

function plan(at){
  const W=workouts(), out=[], why=[];
  if(at.zs && at.zs.z3>0.30) why.push(`Il ${nf(at.zs.z3*100)}% del tuo tempo è in Z3, la "zona grigia": stanca ma allena poco. Il piano separa uscite davvero facili e sedute brevi e intense.`);
  if(at.zs && at.zs.z45<0.05) why.push('Fai pochissimo lavoro intenso: una seduta di qualità a settimana ti alzerà soglia e VO2max.');
  if(at.dec!=null && at.dec>7) why.push(`La deriva cardiaca media è ${nf(at.dec,1)}%: serve più fondo lungo a ritmo costante.`);
  if(at.perWeek<2) why.push(`Esci in media ${nf(at.perWeek,1)} volte a settimana: la costanza viene prima di tutto.`);
  if(at.mtb) why.push('Le tue uscite hanno tanta salita: ho messo lavoro specifico in salita.');
  if(!why.length) why.push('La tua distribuzione è già buona: il piano mantiene l\'80% facile e aggiunge qualità.');
  const n=at.perWeek<2.5? 3 : at.perWeek<3.5? 3 : 4;
  if(n===3){ out.push(['Martedì',W.r3015],['Giovedì',at.zs&&at.zs.z45>=0.1? W.recupero : at.mtb? W.salite : W.soglia],['Domenica',W.fondo]); }
  else { out.push(['Martedì',W.r3015],['Mercoledì',W.recupero],['Giovedì',at.mtb? W.salite : W.soglia],['Domenica',W.fondo]); }
  out.push(['Lunedì e venerdì',W.forza]);
  return {why, week:out, hoursTarget: Math.max(4, Math.min(12, Math.round((at.hours||3)*1.1))) };
}

  const km=acts.reduce((s,a)=>s+a.distance,0)/1000, today=new Date();
  let cells=''; for(let i=0;i<lead;i++) cells+='<span></span>';
  for(let d=1; d<=days; d++){ const L=byDay[d]||[], isT=today.getFullYear()===y&&today.getMonth()===mo&&today.getDate()===d;
    cells+= L.length? `<button class="cal-d has${isT?' today':''}" data-open="${L[0].id}" title="${esc(L.map(a=>a.name).join(', '))}"><span>${d}</span><i>${L.map(a=>`<b class="${kindOf(a)}"></b>`).join('')}</i><small>${nf(L.reduce((s,a)=>s+a.distance,0)/1000)}</small></button>` : `<span class="cal-d${isT?' today':''}"><span>${d}</span></span>`; }
  return `<div class="panel"><div class="toolbar" style="justify-content:space-between"><button data-cal="-1" aria-label="Mese precedente">‹</button><h3 style="text-transform:capitalize">${first.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h3><button data-cal="1" aria-label="Mese successivo">›</button></div>
    <p class="small muted" style="text-align:center">${acts.length} uscite · ${nf(km)} km · ${nf(acts.reduce((s,a)=>s+a.gain,0))} m · <span class="cal-key"><b class="bike"></b> bici <b class="spin"></b> spinning</span></p>
    <div class="cal"><span class="wd">L</span><span class="wd">M</span><span class="wd">M</span><span class="wd">G</span><span class="wd">V</span><span class="wd">S</span><span class="wd">D</span>${cells}</div></div>`;
}
document.addEventListener('click',e=>{ const c=e.target.closest('[data-cal]'); if(c){ const b=state.calMonth? new Date(state.calMonth) : new Date(); state.calMonth=new Date(b.getFullYear(), b.getMonth()+(+c.dataset.cal), 1).getTime(); const p=$('#cal-wrap'); if(p) p.innerHTML=calendarHTML(); } });

/* ====================== navigazione ====================== */
const VIEWS=['riepilogo','attivita','statistiche','classifiche','gruppo','forma','importa','profilo'];
const RENDER={riepilogo:renderRiepilogo, attivita:renderAttivita, statistiche:renderStatistiche, dettaglio:renderDettaglio, classifiche:renderClassifiche, gruppo:renderGruppo, forma:renderForma, importa:renderImporta, profilo:renderProfilo};
function show(view){
  if(typeof flyStop==='function' && $('#fly')) flyStop();
  renderMe();
  state.view=view;
  for(const id of [...VIEWS,'dettaglio']) $('#v-'+id).hidden = id!==view;
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current', (a.dataset.v===view || (view==='dettaglio'&&a.dataset.v==='attivita'))? 'page':'false'));
  for(const k in state.charts){ state.charts[k].destroy(); delete state.charts[k]; }
  if(state.map){ try{ state.map.remove(); }catch(e){} state.map=null; }
  RENDER[view]();
}
function go(view){ if(VIEWS.includes(view) && location.hash!=='#'+view){ location.hash=view; } else show(view); }
function renderAll(){ show(state.view); }
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(VIEWS.includes(h)) show(h); });
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){ e.preventDefault(); state.sel=o.dataset.open; show('dettaglio'); window.scrollTo(0,0); return; }
  const g=e.target.closest('[data-go]'); if(g){ e.preventDefault(); go(g.dataset.go); window.scrollTo(0,0); return; }
  const r=e.target.closest('[data-range]'); if(r){ state.range=+r.dataset.range; document.querySelectorAll('[data-range]').forEach(b=>b.setAttribute('aria-pressed', b===r)); drawFitChart(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ state.q=e.target.value; const pos=e.target.selectionStart; renderAttivita(); const q=$('#q'); q.focus(); q.setSelectionRange(pos,pos); } });
document.addEventListener('change',e=>{ if(e.target.id==='flt'){ state.filter=e.target.value; renderAttivita(); } });
try{ const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener('change',()=>renderAll()); new MutationObserver(()=>renderAll()).observe(document.documentElement,{attributes:true, attributeFilter:['data-theme']}); }catch(e){}

(async function boot(){
  await DB.open();
  const saved=(await DB.all()).sort((a,b)=>b.start-a.start);
  if(saved.length){ state.acts=saved; }
  else { state.acts=makeExamples(); state.examples=true; profile.weight = store('qp-profile')? profile.weight : 78; }
  recompute();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  const back=await stravaHandleRedirect();
  const h=location.hash.slice(1); show(back? 'importa' : VIEWS.includes(h)? h : 'riepilogo');
  const autoSync=()=>{ if(!EMBEDDED && STRAVA.refresh && navigator.onLine!==false && (STRAVA.queue.length || Date.now()-(STRAVA.lastSync||0)>5*60000)) stravaSync('new'); };
  if(!back) autoSync();
  // ogni volta che riapri l'app (o torni su di essa) controlla se ci sono uscite nuove su Strava
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') autoSync(); });
  window.addEventListener('online', autoSync);
  setInterval(()=>{ if(document.visibilityState==='visible') autoSync(); }, 15*60000);
})();
</script>
<script>
window.APP_VERSION='202611100627';
if('serviceWorker' in navigator && location.protocol==='https:'){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js?v='+APP_VERSION).then(reg=>{
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had||reloaded) return; reloaded=true;
    const t=document.createElement('div');
    t.setAttribute('role','status');
    t.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--on-accent);padding:12px 14px;border-radius:10px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.3)';
    t.innerHTML='<span>Nuova versione disponibile</span><button style="background:var(--surface);color:var(--fg);border:none">Aggiorna</button>';
    t.querySelector('button').onclick=()=>location.reload();
    document.body.append(t);
  });
}
</script>
</body>
